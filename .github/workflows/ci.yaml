name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'k8s-manifests/**'
  workflow_dispatch:

jobs:
  # ---- Build both images in parallel ----
  build-rag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          docker system prune -af

      - name: Build & push RAG API
        uses: docker/build-push-action@v5
        with:
          context: ./rag-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.REPO }}/rag-api:${{ github.sha }}
          cache-from: type=gha          # ← read cache from GitHub Actions cache
          cache-to: type=gha,mode=max   # ← write cache back

  build-vlm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          docker system prune -af

      - name: Build & push Ray VLM
        uses: docker/build-push-action@v5
        with:
          context: ./ray-vlm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.REPO }}/ray-vlm:${{ github.sha }}
          cache-from: type=gha          # ← read cache from GitHub Actions cache
          cache-to: type=gha,mode=max   # ← write cache back


  # ---- Update K8s manifests after both builds succeed ----
  update-manifests:
    needs: [build-rag, build-vlm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set lowercase repo name
        run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Clone infra repo
        run: |
          git clone https://x-access-token:${{ secrets.INFRA_REPO_PAT }}@github.com/oussamayousre/rag-infra.git

      - name: Update image tags
        run: |
          cd rag-infra
          sed -i "s|image: ghcr.io/.*/rag-api:.*|image: ghcr.io/${{ env.REPO }}/rag-api:${{ github.sha }}|" rag-api/deployment.yaml
          sed -i "s|image: ghcr.io/.*/ray-vlm:.*|image: ghcr.io/${{ env.REPO }}/ray-vlm:${{ github.sha }}|" ray-vlm/deployment.yaml

      - name: Commit and push
        run: |
          cd rag-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "ci: update images to ${{ github.sha }}"
          git push